<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahul School</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

header {
    background: #1e3a8a;
    color: white;
    padding: 15px;
    text-align: center;
}

.hero {
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1');
    background-size: cover;
    height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: 40px;
}

section {
    padding: 40px;
    text-align: center;
}

.card {
    display: inline-block;
    background: #f1f1f1;
    padding: 20px;
    margin: 10px;
    border-radius: 10px;
    width: 200px;
}

button {
    background: #f59e0b;
    border: none;
    padding: 10px 20px;
    color: white;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

footer {
    background: #1e3a8a;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>

</head>

<body>

<header>
    <h2>Rahul School</h2>
</header>

<div class="hero">
    <div>
        <h1>Welcome to Rahul School</h1>
        <p>Best Education for Bright Future</p>
        <button>Admission Open</button>
    </div>
</div>

<section>
    <h2>About Us</h2>
    <p>We provide quality education from Nursery to 12th class with modern facilities.</p>
</section>

<section>
    <h2>Courses</h2>
    <div class="card">Nursery</div>
    <div class="card">Primary</div>
    <div class="card">Secondary</div>
    <div class="card">Senior Secondary</div>
</section>

<section>
    <h2>Contact</h2>
    <p>Email: info@rahulschool.com</p>
    <p>Phone: +91 9876543210</p>
</section>

<footer>
    <p>© 2026 Rahul School</p>
</footer>

</body>
</html>
