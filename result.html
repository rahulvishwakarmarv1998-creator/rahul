<!DOCTYPE html>
<html>
<head>
<title>Result</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav><h2>Result System</h2></nav>

<div class="container">

<input id="roll" placeholder="Enter Roll No"><br><br>
<button class="btn" onclick="check()">Check Result</button>

<h2 id="res"></h2>

</div>

<script>
function check(){
    let r=document.getElementById("roll").value;

    if(r=="101"){
        document.getElementById("res").innerText="PASS - 88%";
    }else{
        document.getElementById("res").innerText="No Record Found";
    }
}
</script>

</body>
</html>
